version: '3.8'

services:
  neo4j:
    image: neo4j:5.20
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/password123
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data

  app:
    build: .
    depends_on:
      - neo4j
    env_file:
      - .env
    volumes:
      - .:/app

volumes:
  neo4j_data:
